<g font-family="Menlo, Consolas, monospace" font-size="23" fill="#f4f6f1">
<text x="326" y="203"><tspan fill="#9be79f">$ rhoas kafka create</tspan></text>
<text x="326" y="276"><tspan fill="#9be79f">$ rhoas kafka create</tspan> <tspan fill="#f4f6f1">--name my-kafka-instance</tspan></text>
<text x="326" y="349"><tspan fill="#9be79f">$ rhoas kafka create</tspan> <tspan fill="#f4f6f1">--help</tspan></text>
<text x="326" y="422"><tspan fill="#9be79f">$ rhoas kafka create</tspan> <tspan fill="#f4f6f1">-o yaml</tspan></text>
<text x="326" y="495"><tspan fill="#9be79f">$ rhoas service-registry list</tspan></text>
<text x="326" y="568"><tspan fill="#9be79f">$ rhoas service-registry create</tspan> <tspan fill="#f4f6f1">--name myregistry</tspan></text>
</g>
