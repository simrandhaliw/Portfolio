<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">A more useful reminder</title><desc id="desc">A hand-drawn student holds a glowing reminder showing what was forgotten, beside doors with clear Push signs.</desc>
<rect width="800" height="560" fill="#fbfaf7"/>
<!-- Quiet door outlines and directional cues, drawn like notes in a sketchbook. -->
<g stroke="#303936" stroke-linecap="round" stroke-linejoin="round" fill="none">
 <path d="M469 488V94c0-6 4-10 10-10h255c6 0 10 4 10 10v394" stroke-width="3.5"/>
 <path d="M606 86v402M489 108h99v354h-99zm136 0h99v354h-99z" stroke-width="2.8"/>
 <path d="M580 293v31m52-31v31" stroke-width="3"/>
 <path d="M511 240h60m-17-14 17 14-17 14m93-14h55m-17-14 17 14-17 14" stroke="#a65d4b" stroke-width="3.6"/>
</g>
<g font-family="Chalkboard SE, Bradley Hand, Comic Sans MS, cursive" fill="#27352f" text-anchor="middle">
 <text x="541" y="209" font-size="24">PUSH</text><text x="673" y="209" font-size="24">PUSH</text>
</g>
<!-- The person and the object are intentionally simple line art. -->
<g stroke="#303936" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
 <path d="M98 488c0-57 12-96 42-117 13-9 33-15 51-16h46c21 1 42 8 57 21 22 19 33 53 34 112z" fill="#e5efed"/>
 <path d="M184 355v-23m53 23v-23" fill="none"/>
 <path d="M159 233c-4-49 17-82 57-84 40-2 66 30 64 78-1 45-25 80-62 81-35 2-57-29-59-75z" fill="#f4e7da"/>
 <path d="M158 233c-15-44-2-83 36-99 31-13 70-3 87 26 10 19 10 45 2 67-9-24-20-35-40-40-18 16-48 24-85 20z" fill="#56514d"/>
 <path d="M182 248c5-3 11-3 16 0m39 0c5-3 11-3 16 0m-45 30c8 5 18 5 26-1" fill="none" stroke-width="2.5"/>
 <path d="M132 382c-12 35-5 70 20 88 25 18 65 18 95 15m41-103c11 37 4 68-16 84" fill="none"/>
 <path d="M250 401c-9-10-16-17-26-18-9-1-14 5-12 12 2 7 11 9 19 14l36 25" fill="#f4e7da"/>
 <path d="M318 407c11-13 20-20 30-20 8 0 13 6 10 13-3 6-12 9-19 15l-28 20" fill="#f4e7da"/>
</g>
<!-- The reminder names the forgotten item; a small caption makes the point clear. -->
<circle cx="289" cy="349" r="86" fill="#deedf2" stroke="#416c7c" stroke-width="3.5"/>
<circle cx="289" cy="349" r="75" fill="none" stroke="#9abdc8" stroke-width="2"/>
<g font-family="Chalkboard SE, Bradley Hand, Comic Sans MS, cursive" fill="#294753" text-anchor="middle">
 <text x="289" y="327" font-size="21">Remember your</text>
 <text x="289" y="361" font-size="29">potions essay</text>
</g>
<g fill="none" stroke="#d3aa59" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
 <path d="M394 279c5 17 10 22 27 27-17 4-22 10-27 27-5-17-10-23-27-27 17-5 22-10 27-27z"/>
 <path d="M80 297c4 12 8 16 20 20-12 4-16 8-20 20-4-12-8-16-20-20 12-4 16-8 20-20z"/>
</g>
<path d="M51 489h699" fill="none" stroke="#bbc5bd" stroke-width="2" stroke-linecap="round"/>
</svg>
